services:
  mysql:
    image: mysql:8.0.31
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sky_take_out
      MYSQL_USER: sky
      MYSQL_PASSWORD: ${SKY_DATASOURCE_PASSWORD:?SKY_DATASOURCE_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${SKY_DATASOURCE_PASSWORD:?SKY_DATASOURCE_PASSWORD must be set in .env}
      TZ: Asia/Shanghai

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00

    ports:
      - "${SKY_MYSQL_HOST_PORT:-3307}:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - sky-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${SKY_REDIS_HOST_PORT:-6380}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      - sky-network
